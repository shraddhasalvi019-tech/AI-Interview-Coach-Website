<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Profile - AI Interview Coach</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html" class="brand">AI Interview Coach</a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>
      <li><a href="interview_setup.html">New Interview</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="skill_gap.html">Skill Gap</a></li>
      <li><button id="btn-logout" class="btn-nav-logout">Logout</button></li>
    </ul>
  </nav>

  <div class="container" style="max-width: 800px;">
    <div class="page-header">
      <div>
        <h1>Candidate Profile</h1>
        <p>Your profile information is used by GenAI to generate personalized interview questions.</p>
      </div>
    </div>

    <div class="card">
      <div id="alert-box"></div>

      <form id="profile-form">
        <div class="grid-2">
          <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="education">Education</label>
            <input type="text" id="education" class="form-control" placeholder="B.Tech in Computer Science">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="target_role">Target Job Role</label>
            <select id="target_role" class="form-control">
              <option value="Java Developer">Java Developer</option>
              <option value="Python Developer">Python Developer</option>
              <option value="Software Developer">Software Developer</option>
              <option value="Full Stack Developer">Full Stack Developer</option>
              <option value="Data Analyst">Data Analyst</option>
              <option value="Machine Learning Engineer">Machine Learning Engineer</option>
            </select>
          </div>
          <div class="form-group">
            <label for="experience_level">Experience Level</label>
            <select id="experience_level" class="form-control">
              <option value="Fresher">Fresher (0 years)</option>
              <option value="Junior">Junior (1-2 years)</option>
              <option value="Mid-Level">Mid-Level (3-5 years)</option>
              <option value="Senior">Senior (5+ years)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="skills">Technical Skills (Comma separated)</label>
          <input type="text" id="skills" class="form-control" placeholder="Java, SQL, HTML, CSS, Spring Boot, REST APIs">
        </div>

        <div class="form-group">
          <label for="programming_languages">Programming Languages (Comma separated)</label>
          <input type="text" id="programming_languages" class="form-control" placeholder="Java, Python, JavaScript, SQL">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="preferred_interview_type">Default Preferred Interview Type</label>
            <select id="preferred_interview_type" class="form-control">
              <option value="Technical">Technical Interview</option>
              <option value="HR">HR Interview</option>
              <option value="Behavioral">Behavioral Interview</option>
              <option value="Mixed">Mixed Interview</option>
            </select>
          </div>
          <div class="form-group">
            <label for="preferred_difficulty">Default Preferred Difficulty</label>
            <select id="preferred_difficulty" class="form-control">
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
          <button type="submit" class="btn btn-primary">Save Candidate Profile</button>
          <a href="skill_gap.html" class="btn btn-outline">Analyze Skill Gap &rarr;</a>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <p>AI-Powered Intelligent Interview Coaching & Assessment System &copy; 2026</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
