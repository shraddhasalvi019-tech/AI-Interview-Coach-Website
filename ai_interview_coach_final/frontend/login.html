<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Interview Coach</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">AI Interview Coach</a>
    <ul class="nav-links">
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>

  <div class="container" style="max-width: 450px; margin-top: 4rem;">
    <div class="card">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">Candidate Login</h2>
      <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem;">Access your mock interviews and AI scorecards</p>

      <div id="alert-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="candidate@example.com" required value="demo@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required value="password123">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
      </div>
      <div style="margin-top: 0.75rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
        Demo Login: <strong>demo@example.com</strong> / <strong>password123</strong>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
