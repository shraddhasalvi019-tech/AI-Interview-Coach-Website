<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AI Interview Coach</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">AI Interview Coach</a>
    <ul class="nav-links">
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <div class="container" style="max-width: 480px; margin-top: 3rem;">
    <div class="card">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">Candidate Registration</h2>
      <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem;">Create your profile to start AI-powered interview coaching</p>

      <div id="alert-box"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        Already registered? <a href="login.html" style="color: var(--primary); font-weight: 600;">Login here</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
